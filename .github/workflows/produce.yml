name: Deep History Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  # OpsHub triggers this studio with a repository_dispatch.
  # client_payload: {topic, reason}  — topic overrides the queue for that run.
  repository_dispatch:
    types: [opshub.produce, opshub.run]

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache ONLY heavy episode media. `memory/` must NOT be cached: the
      # restore runs after checkout, so a cached copy silently overwrites the
      # committed topics.json/state.json — that clobbered the topic queue and
      # made every run fail with "no queued topics" (2026-10-28/29 failures).
      # memory/ is small and git-owned; git is the single source of truth.
      - name: Restore episode work (images/audio/script) from cache
        uses: actions/cache@v4
        with:
          path: |
            episodes/*/images
            episodes/*/audio
            episodes/*/script.json
            episodes/*/shotlist.json
          key: dhs-work-${{ github.run_id }}
          restore-keys: |
            dhs-work-

      - name: Enforce committed memory state (guard against cache clobber)
        run: git checkout -- memory/ 2>/dev/null || true

      - name: Install deps
        run: |
          set -o pipefail
          pip install -r requirements.txt 2>&1 | tee install.log && true
          test ${PIPESTATUS[0]} -eq 0

      - name: Install ffmpeg (runner images no longer ship it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Write (research + script)
        id: write
        run: |
          set -o pipefail
          python pipeline.py write 2>&1 | tee write.log
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUB_PAYLOAD: ${{ toJSON(github.event.client_payload) }}

      - name: Produce (images + narration + render)
        id: produce
        run: |
          set -o pipefail
          python pipeline.py produce 2>&1 | tee produce.log
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Notify (Telegram + hub)
        id: notify
        if: success()
        run: |
          set -o pipefail
          python pipeline.py notify 2>&1 | tee notify.log
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HUB_URL: ${{ secrets.HUB_URL }}
          OPSHUB_URL: ${{ secrets.OPSHUB_URL }}
          HUB_WEBHOOK_SECRET: ${{ secrets.HUB_WEBHOOK_SECRET }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Artifact fallback if Telegram failed
        if: always() && steps.notify.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: episode-video
          path: episodes/*.mp4
          retention-days: 30

      - name: Commit memory (only on success)
        # Commit as soon as produce succeeded — a later notify failure must not
        # lose the topic retirement, or the next run repeats this episode.
        if: always() && steps.produce.outcome == 'success'
        run: |
          git config user.name "deep-history-studio"
          git config user.email "actions@github.com"
          git add memory/ episodes/*/script.json episodes/*/shotlist.json
          git diff --cached --quiet || git commit -m "episode: auto"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Always save logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: |
            install.log
            write.log
            produce.log
            notify.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Report result to Telegram (quota-aware)
        if: failure()
        run: |
          python - << 'PYEOF'
          import os, json, urllib.request
          tok = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          if tok.lower().startswith("bot"):
              tok = tok[3:]
          chat = os.environ.get("TELEGRAM_CHAT_ID", "")

          step = "unknown step"
          for name, oc in [("write", "${{ steps.write.outcome }}"),
                           ("produce", "${{ steps.produce.outcome }}"),
                           ("notify", "${{ steps.notify.outcome }}")]:
              if oc == "failure":
                  step = name
                  break

          log_file = f"{step}.log"
          log_tail = ""
          if os.path.exists(log_file):
              with open(log_file, errors="replace") as f:
                  log_tail = f.read()[-3000:]
          if not log_tail:
              log_tail = "(log not found — download the run-logs artifact)"

          if "DAILY LIMIT" in log_tail or "daily free allocation" in log_tail:
              text = ("⏳ Cloudflare daily neurons used up — run PAUSED, not broken.\n"
                      "Re-run after UTC midnight; cached images resume where it stopped.\n\n"
                      + log_tail[-1500:])
          else:
              text = (f"🧱 DEEP HISTORY STUDIO FAILED at step: {step}\n"
                      "Log tail:\n" + log_tail)
          text = text[:4000]

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{tok}/sendMessage",
              data=json.dumps({"chat_id": chat, "text": text}).encode(),
              headers={"Content-Type": "application/json"},
          )
          try:
              urllib.request.urlopen(req, timeout=30)
          except Exception as e:
              print(f"telegram report failed (non-fatal): {e}")
          PYEOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
