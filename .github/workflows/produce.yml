name: Deep History Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: ffmpeg check
        run: ffmpeg -version | head -1

      - name: Write (research + script)
        id: write
        run: python pipeline.py write
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Produce (images + narration + render)
        id: produce
        run: python pipeline.py produce
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Notify (Telegram + hub)
        id: notify
        if: success()
        run: python pipeline.py notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Artifact fallback if Telegram failed
        if: always() && steps.notify.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: episode-video
          path: episodes/*.mp4
          retention-days: 30

      - name: Commit memory (only on success)
        if: success()
        run: |
          git config user.name "deep-history-studio"
          git config user.email "actions@github.com"
          git add memory/ episodes/*/script.json episodes/*/shotlist.json
          git diff --cached --quiet || git commit -m "episode: auto"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Failure report to Telegram
        if: failure()
        run: |
          python - << 'PYEOF'
          import os, json, urllib.request
          tok = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["TELEGRAM_CHAT_ID"]
          text = (
              "🧱 DEEP HISTORY STUDIO FAILED — "
              "open the Actions log for the real error:\n"
              "${{ github.server_url }}/${{ github.repository }}"
              "/actions/runs/${{ github.run_id }}"
          )
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{tok}/sendMessage",
              data=json.dumps({"chat_id": chat, "text": text}).encode(),
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(req)
          PYEOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
